<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coffee Street - Audit Log</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/audit_log.css">
</head>
<body>

  <header class="navbar">
    <h2>Coffee Street - Audit Log</h2>
    <div class="nav-right">
      <span id="userRole"></span>
      <button id="logoutBtn" class="btn-danger">Logout</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <h3>Menu</h3>
      <ul id="menuList"></ul>
    </aside>

    <main class="content">
      <h1>Audit Log Sistem</h1>
      <p>Audit log berisi seluruh aktivitas approval dan keputusan penting dalam sistem.</p>

      <div class="card-filter">
        <h3>Filter</h3>

        <div class="form-group">
          <label>Filter Aksi</label>
          <select id="filterAction">
            <option value="ALL">Semua</option>
            <option value="APPROVE_PAYROLL">Approve Payroll</option>
            <option value="REJECT_PAYROLL">Reject Payroll</option>
            <option value="APPROVE_LAPORAN">Approve Laporan</option>
            <option value="REJECT_LAPORAN">Reject Laporan</option>
            <option value="APPROVE_PEMBELIAN">Approve Pembelian</option>
            <option value="REJECT_PEMBELIAN">Reject Pembelian</option>
          </select>
        </div>

        <button id="btnApplyFilter" class="btn-primary">Terapkan Filter</button>
        <button id="btnResetFilter" class="btn-secondary">Reset</button>
      </div>

      <div class="card-table">
        <h3>Daftar Audit Log</h3>

        <table>
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>Aktor</th>
              <th>Role</th>
              <th>Aksi</th>
              <th>Target ID</th>
              <th>Deskripsi</th>
            </tr>
          </thead>
          <tbody id="auditTable"></tbody>
        </table>
      </div>

      <button id="btnClearLog" class="btn-danger">Hapus Semua Log</button>

    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/audit_log.js"></script>
</body>
</html>
