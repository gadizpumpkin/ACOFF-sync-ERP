<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coffee Street - Approval Payroll</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/approval_payroll.css">
</head>
<body>

  <header class="navbar">
    <h2>Coffee Street - Approval Payroll (Owner)</h2>
    <div class="nav-right">
      <span id="userRole"></span>
      <button id="logoutBtn" class="btn-danger">Logout</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <h3>Menu</h3>
      <ul id="menuList"></ul>
    </aside>

    <main class="content">
      <h1>Approval Payroll</h1>

      <div class="card-table">
        <h3>Payroll Pending</h3>
        <table>
          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Total Profit</th>
              <th>Payroll Pool</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="pendingTable"></tbody>
        </table>
      </div>

      <div class="card-detail">
        <h3>Detail Payroll</h3>
        <div id="detailPayroll">Pilih payroll untuk melihat detail.</div>
      </div>

    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/approval_payroll.js"></script>
</body>
</html>
