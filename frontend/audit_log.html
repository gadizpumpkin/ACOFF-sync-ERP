<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coffee Street - Audit Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/audit_log.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="cs-nav">
    <div class="cs-nav-brand">
      <svg class="cs-nav-logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="15" stroke="#C9913A" stroke-width="1.5"/>
        <path d="M9 20c0-3.866 3.134-7 7-7s7 3.134 7 7" stroke="#C9913A" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M13 20v-3a3 3 0 016 0v3" stroke="#C9913A" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M22 14c1-1 2.5-1 2.5 0s-1 1.5-1 2.5" stroke="#C9913A" stroke-width="1" stroke-linecap="round"/>
      </svg>
      <span class="cs-nav-title">Coffee Street <span class="cs-nav-subtitle">/ Audit Log</span></span>
    </div>
    <div class="cs-nav-right">
      <span class="cs-role-badge" id="userRole">Owner</span>
      <button id="logoutBtn" class="cs-btn-logout">Logout</button>
    </div>
  </nav>

  <!-- LAYOUT -->
  <div class="cs-layout">

    <!-- SIDEBAR -->
    <aside class="cs-sidebar">
      <div class="cs-sidebar-label">Menu</div>
      <ul class="cs-menu" id="menuList">
        <li>
          <a href="dashboard.html">
            <svg class="cs-menu-icon" viewBox="0 0 16 16" fill="none">
              <rect x="2" y="2" width="5" height="5" rx="1" fill="currentColor"/>
              <rect x="9" y="2" width="5" height="5" rx="1" fill="currentColor" opacity=".5"/>
              <rect x="2" y="9" width="5" height="5" rx="1" fill="currentColor" opacity=".5"/>
              <rect x="9" y="9" width="5" height="5" rx="1" fill="currentColor" opacity=".5"/>
            </svg>
            Dashboard
          </a>
        </li>
        <li>
          <a href="pembelian.html">
            <svg class="cs-menu-icon" viewBox="0 0 16 16" fill="none">
              <path d="M2 3h1.5l2 7h7l1.5-5H5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="7" cy="13" r="1" fill="currentColor"/>
              <circle cx="11" cy="13" r="1" fill="currentColor"/>
            </svg>
            Pembelian
          </a>
        </li>
        <li>
          <a href="payroll.html">
            <svg class="cs-menu-icon" viewBox="0 0 16 16" fill="none">
              <rect x="2" y="3" width="12" height="10" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
              <path d="M5 8h2M9 8h2M5 11h1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              <path d="M5 5h6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
            Payroll
          </a>
        </li>
        <li>
          <a href="laporan.html">
            <svg class="cs-menu-icon" viewBox="0 0 16 16" fill="none">
              <path d="M3 4h10M3 8h10M3 12h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            Laporan
          </a>
        </li>
        <li class="active">
          <a href="audit_log.html">
            <svg class="cs-menu-icon" viewBox="0 0 16 16" fill="none">
              <path d="M3 2h10a1 1 0 011 1v10a1 1 0 01-1 1H3a1 1 0 01-1-1V3a1 1 0 011-1z" stroke="currentColor" stroke-width="1.5"/>
              <path d="M5 5h6M5 8h6M5 11h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              <circle cx="12" cy="12" r="3" fill="#F5F3EF" stroke="currentColor" stroke-width="1.2"/>
              <path d="M11 12l.8.8L13 11" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Audit Log
          </a>
        </li>
      </ul>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="cs-main">

      <!-- PAGE HEADER -->
      <div class="cs-page-header">
        <h1 class="cs-page-title">Audit Log Sistem</h1>
        <p class="cs-page-sub">Seluruh aktivitas <strong>approval</strong> dan keputusan penting tercatat di sini.</p>
      </div>

      <!-- FILTER -->
      <div class="cs-card">
        <div class="cs-card-head">
          <div class="cs-card-title">
            <span class="cs-dot"></span>
            Filter Log
          </div>
        </div>
        <div class="cs-filter-row">
          <div class="cs-form-group cs-filter-grow">
            <label for="filterAction">Filter Aksi</label>
            <select id="filterAction">
              <option value="ALL">Semua Aksi</option>
              <option value="APPROVE_PAYROLL">Approve Payroll</option>
              <option value="REJECT_PAYROLL">Reject Payroll</option>
              <option value="APPROVE_LAPORAN">Approve Laporan</option>
              <option value="REJECT_LAPORAN">Reject Laporan</option>
              <option value="APPROVE_PEMBELIAN">Approve Pembelian</option>
              <option value="REJECT_PEMBELIAN">Reject Pembelian</option>
            </select>
          </div>
          <div class="cs-filter-actions">
            <button id="btnApplyFilter" class="cs-btn-filter">
              <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
                <path d="M1 2h11M3 6h7M5 10h3" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
              Terapkan
            </button>
            <button id="btnResetFilter" class="cs-btn-reset">
              <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
                <path d="M1.5 6.5a5 5 0 105-5H4M4 1.5L2 3.5l2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Reset
            </button>
          </div>
        </div>
      </div>

      <!-- TABEL AUDIT LOG -->
      <div class="cs-card">
        <div class="cs-card-head">
          <div class="cs-card-title">
            <span class="cs-dot"></span>
            Daftar Audit Log
          </div>
          <button id="btnClearLog" class="cs-btn-clear">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
              <path d="M2 3.5h9M5 3.5V2.5a.5.5 0 01.5-.5h2a.5.5 0 01.5.5v1M3.5 3.5l.5 7h5l.5-7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Hapus Semua Log
          </button>
        </div>
        <div class="cs-table-wrap">
          <table class="cs-table cs-table-audit">
            <thead>
              <tr>
                <th>Timestamp</th>
                <th>Aktor</th>
                <th>Role</th>
                <th>Aksi</th>
                <th>Target ID</th>
                <th>Deskripsi</th>
              </tr>
            </thead>
            <tbody id="auditTable">
              <!-- diisi audit_log.js -->
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/audit_log.js"></script>
</body>
</html>
