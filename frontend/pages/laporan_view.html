<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coffee Street - View Laporan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../ css/laporan_view.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="cs-nav">
    <div class="cs-nav-brand">
      <svg class="cs-nav-logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="15" stroke="#C9913A" stroke-width="1.5"/>
        <path d="M9 20c0-3.866 3.134-7 7-7s7 3.134 7 7" stroke="#C9913A" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M13 20v-3a3 3 0 016 0v3" stroke="#C9913A" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M22 14c1-1 2.5-1 2.5 0s-1 1.5-1 2.5" stroke="#C9913A" stroke-width="1" stroke-linecap="round"/>
      </svg>
      <span class="cs-nav-title">Coffee Street <span class="cs-nav-subtitle">/ Detail Laporan</span></span>
    </div>
    <div class="cs-nav-right">
      <span class="cs-role-badge" id="userRole">Manajer</span>
      <button id="logoutBtn" class="cs-btn-logout">Logout</button>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="cs-view-container">

    <!-- PAGE HEADER -->
    <div class="cs-page-header">
      <div class="cs-page-header-row">
        <div>
          <h1 class="cs-page-title">Detail Laporan</h1>
          <p class="cs-page-sub">Ringkasan lengkap laporan periode yang dipilih.</p>
        </div>
        <div class="cs-header-actions">
          <button class="cs-btn-print" onclick="window.print()">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <rect x="2" y="5" width="10" height="7" rx="1" stroke="currentColor" stroke-width="1.4"/>
              <path d="M4 5V3a1 1 0 011-1h4a1 1 0 011 1v2" stroke="currentColor" stroke-width="1.4"/>
              <path d="M4 9h6M4 11h3.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
            Cetak
          </button>
          <button class="cs-btn-back" onclick="window.history.back()">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Kembali
          </button>
        </div>
      </div>
    </div>

    <!-- REPORT CONTENT CARD -->
    <div class="cs-card cs-card-report">
      <div id="laporanContent" class="cs-report-loading">
        <svg class="cs-loading-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="9" stroke="#C9913A" stroke-width="2" stroke-dasharray="28 56" stroke-linecap="round"/>
        </svg>
        Memuat laporan...
      </div>
    </div>

  </main>

  <script src="js/export.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/laporan_view.js"></script>
</body>
</html>
