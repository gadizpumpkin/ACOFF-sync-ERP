<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coffee Street - Paycheck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/paycheck.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="cs-nav">
    <div class="cs-nav-brand">
      <svg class="cs-nav-logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="15" stroke="#C9913A" stroke-width="1.5"/>
        <path d="M9 20c0-3.866 3.134-7 7-7s7 3.134 7 7" stroke="#C9913A" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M13 20v-3a3 3 0 016 0v3" stroke="#C9913A" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M22 14c1-1 2.5-1 2.5 0s-1 1.5-1 2.5" stroke="#C9913A" stroke-width="1" stroke-linecap="round"/>
      </svg>
      <span class="cs-nav-title">Coffee Street <span class="cs-nav-subtitle">/ Paycheck</span></span>
    </div>
    <div class="cs-nav-right">
      <span class="cs-role-badge" id="userRole">Karyawan</span>
      <button id="logoutBtn" class="cs-btn-logout">Logout</button>
    </div>
  </nav>

  <!-- LAYOUT -->
  <div class="cs-layout">

    <!-- SIDEBAR -->
    <aside class="cs-sidebar">
      <div class="cs-sidebar-label">Menu</div>
      <ul class="cs-menu" id="menuList">
        <li>
          <a href="dashboard.html">
            <svg class="cs-menu-icon" viewBox="0 0 16 16" fill="none">
              <rect x="2" y="2" width="5" height="5" rx="1" fill="currentColor"/>
              <rect x="9" y="2" width="5" height="5" rx="1" fill="currentColor" opacity=".5"/>
              <rect x="2" y="9" width="5" height="5" rx="1" fill="currentColor" opacity=".5"/>
              <rect x="9" y="9" width="5" height="5" rx="1" fill="currentColor" opacity=".5"/>
            </svg>
            Dashboard
          </a>
        </li>
        <li>
          <a href="absensi.html">
            <svg class="cs-menu-icon" viewBox="0 0 16 16" fill="none">
              <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5"/>
              <path d="M8 5v3l2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            Absensi
          </a>
        </li>
        <li>
          <a href="transaksi.html">
            <svg class="cs-menu-icon" viewBox="0 0 16 16" fill="none">
              <path d="M2 4h12M2 8h8M2 12h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="12" cy="11" r="3" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            Transaksi
          </a>
        </li>
        <li class="active">
          <a href="paycheck.html">
            <svg class="cs-menu-icon" viewBox="0 0 16 16" fill="none">
              <rect x="2" y="3" width="12" height="10" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
              <path d="M5 7h2M9 7h2M5 10h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              <path d="M5 5h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
            Paycheck
          </a>
        </li>
        <li>
          <a href="laporan.html">
            <svg class="cs-menu-icon" viewBox="0 0 16 16" fill="none">
              <path d="M3 4h10M3 8h10M3 12h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            Laporan
          </a>
        </li>
      </ul>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="cs-main">

      <!-- PAGE HEADER -->
      <div class="cs-page-header">
        <div class="cs-page-header-row">
          <div>
            <h1 class="cs-page-title">Slip Gaji</h1>
            <p class="cs-page-sub">Riwayat pembayaran gaji kamu dari Coffee Street.</p>
          </div>
          <div class="cs-export-row">
            <button id="btnExportPaycheckPDF" class="cs-btn-export cs-btn-export-pdf">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M3 1h6l3 3v9H3V1z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                <path d="M8 1v4h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M5 8h4M5 10.5h2.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              </svg>
              Export PDF
            </button>
            <button id="btnExportPaycheckExcel" class="cs-btn-export cs-btn-export-excel">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <rect x="1.5" y="1.5" width="11" height="11" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
                <path d="M5 5l4 4M9 5l-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
              Export Excel
            </button>
          </div>
        </div>
      </div>

      <!-- RIWAYAT PAYCHECK -->
      <div class="cs-card">
        <div class="cs-card-head">
          <div class="cs-card-title">
            <span class="cs-dot"></span>
            Riwayat Paycheck Saya
          </div>
        </div>
        <div class="cs-table-wrap">
          <table class="cs-table">
            <thead>
              <tr>
                <th>Tanggal</th>
                <th>Gaji</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="paycheckTable">
              <!-- diisi paycheck.js -->
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <script src="js/export.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/paycheck.js"></script>
</body>
</html>
