<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coffee Street - Paycheck</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/paycheck.css">
</head>
<body>

  <header class="navbar">
    <h2>Coffee Street - Paycheck</h2>
    <div class="nav-right">
      <span id="userRole"></span>
      <button id="logoutBtn" class="btn-danger">Logout</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <h3>Menu</h3>
      <ul id="menuList"></ul>
    </aside>

    <main class="content">
      <h1>Slip Gaji (Paycheck)</h1>
      <button id="btnExportPaycheckPDF" class="btn-primary">Export PDF</button>
      <button id="btnExportPaycheckExcel" class="btn-success">Export Excel</button>

      <div class="card-table">
        <h3>Riwayat Paycheck Saya</h3>
        <table>
          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Gaji</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="paycheckTable"></tbody>
        </table>
      </div>

    </main>
  </div>
  
  <script src="js/export.js"></script>
  <script src="js/paycheck.js"></script>

  <script src="js/auth.js"></script>
  <script src="js/paycheck.js"></script>
</body>
</html>
