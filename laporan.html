<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coffee Street - Generate Laporan</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/laporan.css">
</head>
<body>

  <header class="navbar">
    <h2>Coffee Street - Generate Laporan (Manajer)</h2>
    <div class="nav-right">
      <span id="userRole"></span>
      <button id="logoutBtn" class="btn-danger">Logout</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <h3>Menu</h3>
      <ul id="menuList"></ul>
    </aside>

    <main class="content">
      <h1>Generate Laporan</h1>
      <p>Laporan harian hanya tersimpan di database. Laporan resmi hanya Weekly / Monthly.</p>

      <div class="card-form">
        <h3>Form Generate Laporan</h3>

        <div class="form-group">
          <label>Jenis Laporan</label>
          <select id="jenisLaporan">
            <option value="Weekly">Weekly</option>
            <option value="Monthly">Monthly</option>
          </select>
        </div>

        <div class="form-group">
          <label>Periode Mulai</label>
          <input type="date" id="periodeMulai">
        </div>

        <div class="form-group">
          <label>Periode Selesai</label>
          <input type="date" id="periodeSelesai">
        </div>

        <button id="btnGenerate" class="btn-success">Generate</button>
      </div>

      <div class="card-table">
        <h3>Riwayat Laporan</h3>
        <table>
          <thead>
            <tr>
              <th>Jenis</th>
              <th>Periode</th>
              <th>Total Omzet</th>
              <th>Total Transaksi</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="laporanTable"></tbody>
        </table>
      </div>

    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/laporan.js"></script>
</body>
</html>
